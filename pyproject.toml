[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cyprus"
version = "0.1.0"
description = "Config-driven scraping bot for marketplace, news, and job listings"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "protego>=0.4",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "bleach>=6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cyprus = "cyprus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyprus = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
